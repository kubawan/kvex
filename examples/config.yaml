vaults:
  # In-memory mock vault, pre-seeded with sample secrets. Needs no Azure
  # credential and never leaves this process — useful for trying kvex out
  # or developing the UI without real Key Vault access.
  - name: mock
    uri: mock://local

  # Real vaults go here — replace with your own names/URIs.
  - name: dev
    uri: https://dev-kv.vault.azure.net/
  - name: test
    uri: https://test-kv.vault.azure.net/
    subscription: my-test-subscription
  - name: prod
    uri: https://prod-kv.vault.azure.net/
    subscription: my-prod-subscription
